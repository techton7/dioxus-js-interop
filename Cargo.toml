[workspace]
resolver = "2"
members = [
    "crates/dioxus-js-bindgen",
    "crates/dioxus-js-bindgen-macro",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/dioxus-js-bindgen"
authors = ["Techton <contact@techton.io>"]

[workspace.dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["document", "hooks", "signals", "macro", "html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
swc_core = { version = "78.0", features = ["common", "ecma_parser", "ecma_ast", "ecma_visit", "ecma_codegen", "ecma_transforms_typescript"] }
